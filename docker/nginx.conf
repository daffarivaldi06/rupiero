server {
  listen 8080;
  root /usr/share/nginx/html;

  # expo-sqlite on web needs cross-origin isolation. "credentialless" still allows the ECB rate fetch
  # (Frankfurter). These are the only add_header lines: a location with its own add_header would drop
  # them, so caching below uses `expires`.
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Embedder-Policy credentialless always;

  # Bundles and assets have content hashes in their names.
  location /_expo/static/ {
    expires 1y;
  }

  location /assets/ {
    expires 1y;
  }

  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
