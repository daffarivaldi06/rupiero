plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.applocale'
version = '1.0.0'

android {
  namespace "expo.modules.applocale"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.appcompat:appcompat:1.7.0"
}
